model: Post
slug: posts
table: posts

options:
  belongs_to_organization: true
  soft_deletes: true
  pagination: true
  per_page: 25

columns:
  title:
    type: string
    nullable: false
    searchable: true
    sortable: true
  content:
    type: text
    nullable: true
    searchable: true
  status:
    type: string
    nullable: true
    default: "draft"
    filterable: true
  published_at:
    type: datetime
    nullable: true
    sortable: true
  user_id:
    type: foreignId
    foreign_model: User
    index: true

relationships:
  - type: belongsTo
    model: Organization
  - type: belongsTo
    model: User
  - type: hasMany
    model: Video
  - type: hasMany
    model: AnalyticsData

permissions:
  admin:
    actions: [index, show, store, update, destroy, trashed, restore, forceDelete]
    show_fields: "*"
    create_fields: "*"
    update_fields: "*"
  content_team_member:
    actions: [index, show, store, update, destroy, trashed, restore]
    show_fields: "*"
    create_fields:
      - title
      - content
      - status
      - published_at
      - user_id
    update_fields:
      - title
      - content
      - status
      - published_at
      - user_id  viewer:
    actions: [index, show]
    show_fields: "*"
