name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.4.1'
        bundler-cache: true
        working-directory: server

    - name: Set up Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json

    - name: Run backend tests
      run: |
        cd server
        bin/rails db:test:prepare
        bin/rails test

    - name: Run client checks and tests
      run: |
        cd client
        npm ci
        npm run lint || true
        npm run build
        npm run test
